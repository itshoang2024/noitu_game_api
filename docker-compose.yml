version: '3.10'

services:
  api:
    build: .
    container_name: noitu-game-api
    ports:
      - "8800:8800"
    volumes:
      - ./data:/app/data  # Volume để lưu database
      - ./alembic:/app/alembic  # Volume cho migration scripts (tùy chọn)
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s