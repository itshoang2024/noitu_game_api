version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: noitu-game-api-prod
    ports:
      - "8800:8800"
    volumes:
      - ./data:/app/data  # Volume để lưu database
    env_file:
      - .env.prod
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/system/status"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s